<!doctype html><html lang="en"><head><title>Addition | Little Learning Lab</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="../assets/css/styles.css"><link rel="icon" type="image/x-icon" href="../favicon.ico?v=puppy3"><link rel="icon" type="image/png" sizes="32x32" href="../assets/img/branding/favicon-32.png?v=puppy3"><link rel="apple-touch-icon" sizes="180x180" href="../assets/img/branding/apple-touch-icon.png?v=puppy3"></head><body data-page="addition"><nav id="appbar" class="appbar" aria-label="App navigation"><div class="nav-group" data-nav-slot="links"></div><span class="appbar-title"></span><div class="nav-group" data-nav-slot="reading"></div><div class="nav-group nav-actions" data-nav-slot="actions"></div><div class="nav-group" data-nav-slot="timer"></div><p id="app-notice" class="app-notice" role="status" aria-live="polite"></p></nav>
<main class="page-content addition-page">
<section id="setup-panel" class="setup-panel"><h1>Addition</h1><p class="addition-intro">Choose your numbers, then practise adding with the number pad.</p>
<form id="addition-settings">
<fieldset class="addition-settings-box"><legend>Quick choices</legend><div class="addition-presets"><button type="button" class="btn btn-outline-primary" data-addition-preset="5">Sums up to 5</button><button type="button" class="btn btn-outline-primary" data-addition-preset="10">Sums up to 10</button><button type="button" class="btn btn-outline-primary" data-addition-preset="20">Sums up to 20</button><button type="button" class="btn btn-outline-primary" data-addition-preset="fixed5">Add with 5</button><button type="button" class="btn btn-outline-primary" data-addition-preset="range">Custom range</button></div></fieldset>
<label class="form-label" for="addition-mode">Practice type</label><select id="addition-mode" class="form-select"><option value="sum">Choose a sum range</option><option value="fixed">Add with one fixed number</option><option value="range">Choose the range for both numbers</option></select>
<div class="addition-settings-row" data-addition-mode="sum"><label>Smallest sum<input id="addition-sum-min" class="form-control" type="number" min="0" max="40" step="1" value="0" required></label><label>Largest sum<input id="addition-sum-max" class="form-control" type="number" min="0" max="40" step="1" value="10" required></label></div>
<div class="addition-settings-row" data-addition-mode="fixed" hidden><label>Always add with<input id="addition-fixed" class="form-control" type="number" min="0" max="20" step="1" value="5" required></label><label>Other number: from<input id="addition-other-min" class="form-control" type="number" min="0" max="20" step="1" value="0" required></label><label>Other number: through<input id="addition-other-max" class="form-control" type="number" min="0" max="20" step="1" value="5" required></label></div>
<div class="addition-settings-row" data-addition-mode="range" hidden><label>Both numbers: from<input id="addition-min" class="form-control" type="number" min="0" max="20" step="1" value="0" required></label><label>Through<input id="addition-max" class="form-control" type="number" min="0" max="20" step="1" value="10" required></label></div>
<div class="addition-settings-row"><label>Number of questions<input id="addition-count" class="form-control" type="number" min="1" max="50" step="1" value="10" required></label><label class="addition-zero-label"><input id="addition-zero" class="form-check-input" type="checkbox" checked> Include zero</label></div><p class="addition-settings-note">Numbers can be 0–20, with sums up to 40. Small ranges may repeat after all matching facts have been used.</p><p id="addition-settings-error" role="alert"></p><button type="submit" class="btn btn-primary btn-lg">Start adding</button></form></section>
<section id="addition-practice" hidden><div id="addition-round" class="addition-round"><div class="addition-question-area"><div class="addition-progress-row"><p id="addition-progress"></p><button id="addition-hint" type="button" class="addition-hint" aria-label="Show or hide counting stars" aria-expanded="false" aria-controls="addition-stars" title="Count the stars">?</button></div><p id="addition-question-description" class="visually-hidden" role="status"></p><div class="addition-equation" role="group" aria-label="Addition question"><span id="addition-a"></span><span>+</span><span id="addition-b"></span><span>=</span><output id="addition-answer" aria-label="Your answer" aria-live="polite">?</output></div><section id="addition-stars" class="addition-stars" hidden aria-label="Counting help"><p>Count all the stars, then tap your answer.</p><div class="addition-star-groups"><div id="addition-stars-a" class="addition-star-pile" role="group"></div><span class="addition-star-plus" aria-hidden="true">+</span><div id="addition-stars-b" class="addition-star-pile" role="group"></div></div></section><p id="addition-feedback" class="addition-feedback" role="status" aria-live="polite"></p></div><form id="addition-answer-form" class="addition-answer-form" aria-label="Answer keypad"><div id="addition-keypad" class="addition-keypad"><button type="button" class="addition-key" data-digit="1">1</button>
<button type="button" class="addition-key" data-digit="2">2</button>
<button type="button" class="addition-key" data-digit="3">3</button>
<button type="button" class="addition-key" data-digit="4">4</button>
<button type="button" class="addition-key" data-digit="5">5</button>
<button type="button" class="addition-key" data-digit="6">6</button>
<button type="button" class="addition-key" data-digit="7">7</button>
<button type="button" class="addition-key" data-digit="8">8</button>
<button type="button" class="addition-key" data-digit="9">9</button><button type="button" class="addition-key" id="addition-backspace" aria-label="Delete last answer digit"><span aria-hidden="true">⌫</span><small>Delete</small></button><button type="button" class="addition-key" data-digit="0">0</button><button type="submit" class="addition-key addition-key-check" aria-label="Check answer"><span aria-hidden="true">✓</span><small>Check</small></button></div></form></div><section id="addition-summary" class="addition-summary" hidden><h2>Great adding!</h2><p id="addition-result"></p><button id="addition-again" type="button" class="btn btn-primary btn-lg">Practise again</button></section></section>
</main><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="../assets/js/app.js"></script><script src="../assets/js/math/addition.js"></script></body></html>
