<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Tools</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <script src="assets/js/home.js" defer></script>
</head>
<body class="home-page">
  <main class="home-main container">
    <header class="home-heading">
      <p class="home-eyebrow">Let's practice reading</p>
      <h1>Reading Tools</h1>
      <p>Choose an activity to get started.</p>
    </header>
    <nav class="tool-grid" aria-label="Reading activities">
      <a class="tool-block tool-block-slider" href="slider.html">
        <svg class="tool-icon" viewBox="0 0 80 80" fill="none" aria-hidden="true">
          <path d="M14 25h52M14 40h38" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M14 60h52" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <circle cx="35" cy="60" r="9" fill="currentColor"/>
        </svg>
        <h2>Reading Slider</h2>
        <p>Slide through words and sentences as you read.</p>
        <span class="tool-open">Start reading <span aria-hidden="true">→</span></span>
      </a>
      <a class="tool-block tool-block-pyramid" href="pyramid.html">
        <svg class="tool-icon" viewBox="0 0 80 80" fill="none" aria-hidden="true">
          <path d="M33 17h14M25 32h30M17 47h46M9 62h62" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
        </svg>
        <h2>Sentence Pyramids</h2>
        <p>Build a sentence one line at a time.</p>
        <span class="tool-open">Start a pyramid <span aria-hidden="true">→</span></span>
      </a>
    </nav>
  </main>
</body>
</html>
