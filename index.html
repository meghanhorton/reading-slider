<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reading Slider</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <main class="container setup">
        <h1>Reading Slider</h1>
        <form id="setup"><label for="text" class="form-label">Reading passage</label><textarea id="text"
                class="form-control form-control-lg" rows="4"
                maxlength="2000">I can read. I love books.</textarea><label for="size"
                class="form-label mt-3">Text size: <span id="size-label">64px</span></label><input id="size"
                class="form-range" type="range" min="36" max="96" value="64"><button
                class="btn btn-primary btn-lg mt-3">Start reading</button>
            <p id="message" role="status"></p>
            <p class="text-secondary">Each sentence starts on a new screen. Line breaks also start a new screen.</p>
        </form>
    </main>
    <section id="reader" hidden aria-label="Reading activity">
        <header><button id="edit" class="btn btn-outline-secondary">Edit text</button><span id="count"></span><button
                id="reset" class="btn btn-outline-secondary">Reset all</button></header>
        <div id="pages"></div>
        <nav aria-label="Reading pages"><button id="prev" aria-label="Previous page">↑</button><button id="next"
                aria-label="Next page">↓</button></nav>
        <div id="status" role="status" aria-live="polite"></div>
    </section>
    <div id="measure" aria-hidden="true"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/enhancements.js"></script>

</body>

</html>
