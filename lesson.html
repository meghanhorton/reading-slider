<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lesson Plan</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/lesson.css" />
    <link rel="stylesheet" href="assets/css/lesson-total.css">
    <link rel="stylesheet" href="assets/css/interface.css" />
    <script src="assets/js/interface-core.js"></script>
  </head>
  <body>
    <main id="lesson-page" class="container lesson-main">
      <nav class="lesson-topbar" aria-label="Lesson controls">
        <a class="btn btn-outline-secondary" href="index.html">home</a
        ><button id="lesson-edit" class="btn btn-outline-primary">
          Edit lesson</button
        ><button id="lesson-copy" class="btn btn-primary">⧉ Copy Link</button
        ><button id="lesson-share" class="btn btn-outline-primary">
          Share
        </button>
      </nav>
      <div class="lesson-heading">
        <h1 id="lesson-title"></h1>
        <label class="lesson-editor form-label" for="lesson-title-input"
          >Lesson title</label
        ><input
          id="lesson-title-input"
          class="form-control form-control-lg lesson-editor"
          maxlength="200"
        />
        <p id="lesson-progress" class="mt-3" role="status"></p>
      </div>
      <p class="lesson-note">
        Changes save in this browser. Copy or share the current link to move the
        lesson to another device. Devices do not live-sync.
      </p>
      <p
        id="lesson-message"
        class="lesson-message"
        role="status"
        aria-live="polite"
      ></p>
      <div id="lesson-sections"></div>
      <button
        id="lesson-add-section"
        class="btn btn-outline-primary lesson-editor mb-4"
      >
        + Add section
      </button>
      <div class="lesson-actions">
        <button id="lesson-new" class="btn btn-outline-secondary">
          New plan</button
        ><button id="lesson-clear" class="btn btn-outline-secondary">
          Clear checkboxes</button
        ><button id="lesson-export" class="btn btn-outline-secondary">
          Save backup</button
        ><label class="btn btn-outline-secondary mb-0"
          >Import backup<input
            id="lesson-import"
            class="visually-hidden"
            type="file"
            accept="application/json,.json"
        /></label>
      </div>
    </main>
    <dialog id="lesson-share-dialog">
      <h2>Copy lesson link</h2>
      <label for="lesson-link">Copy this link and open it on your iPad</label
      ><textarea
        id="lesson-link"
        class="form-control mt-3"
        rows="6"
        readonly
      ></textarea>
      <p class="lesson-note mt-3">
        For sharing between devices, open this page on your hosted website—not
        as a local file.
      </p>
      <button id="lesson-dialog-close" class="btn btn-primary">Close</button>
    </dialog>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="assets/js/lesson-common.js"></script>
    <script src="assets/js/lesson-local-links.js"></script>
    <script src="assets/js/lesson.js"></script>
    <script src="assets/js/lesson-total.js"></script>
    <script src="assets/js/activity-timers.js"></script>
    <script src="assets/js/interface.js"></script>
  </body>
</html>
