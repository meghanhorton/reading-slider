<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentence Pyramids</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/share-link.css"><link rel="stylesheet" href="assets/css/pyramid.css"></head>
<body class="pyramid-mode"><main class="container setup"><h1>Sentence Pyramids</h1><form id="setup"><input id="mode" type="hidden" value="text"><label for="text" class="form-label">Enter one pyramid line per row</label><textarea id="text" class="form-control form-control-lg" rows="7" maxlength="50000">A
A mat
A mat fit
A mat fit in a
A mat fit in a hut.</textarea><label for="size" class="form-label mt-3">Text size: <span id="size-label">56px</span></label><input id="size" class="form-range" type="range" min="28" max="96" value="56"><p class="small text-secondary">The pyramid automatically scales to fit the screen. Complete each line to reveal the next slider.</p><button class="btn btn-primary btn-lg mt-3">Start reading</button><p id="message" role="status" class="text-danger mt-3"></p></form></main>
<section id="reader" aria-label="Sentence pyramid reading activity" hidden><header><button id="edit" class="btn btn-outline-secondary">Edit</button></header><div id="pages"></div><footer><div class="example-controls"><button id="previous-example" class="btn btn-outline-secondary" aria-label="Previous pyramid">←</button><span id="example-count"></span><button id="next-example" class="btn btn-outline-primary" aria-label="Next pyramid">→</button></div><div id="status" role="status" aria-live="polite"></div></footer></section><div id="measure" aria-hidden="true"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/pyramid.js"></script><script src="assets/js/app.js"></script><script src="assets/js/share-link.js"></script></body></html>
