<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reading Slider</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/share-link.css" />
    <link rel="stylesheet" href="assets/css/lesson.css" />
    <link rel="stylesheet" href="assets/css/interface.css" />
    <link rel="stylesheet" href="assets/css/slider-track-colors.css">
    <script src="assets/js/interface-core.js"></script>
  </head>
  <body>
    <main class="container setup">
      <h1>Reading Slider</h1>
      <form id="setup">
        <label for="mode" class="form-label">Input format</label
        ><select id="mode" class="form-select mb-3">
          <option value="text">Plain text — one example</option>
          <option value="csv">
            CSV — each nonempty cell is an example
          </option></select
        ><label for="text" class="form-label">Reading text or CSV</label
        ><textarea
          id="text"
          class="form-control form-control-lg"
          rows="6"
          maxlength="50000"
        >
The cat sat on the mat. The dog ran to the barn.</textarea
        >
        <p class="small text-secondary mt-2">
          In CSV mode, quote text containing commas. A single-column header
          named text, sentence, or example is skipped.
        </p>
        <label for="size" class="form-label"
          >Text size: <span id="size-label">64px</span></label
        ><input
          id="size"
          class="form-range"
          type="range"
          min="36"
          max="96"
          value="64"
        /><button class="btn btn-primary btn-lg mt-3">Start reading</button>
        <p id="message" role="status" class="text-danger mt-3"></p>
      </form>
    </main>
    <section id="reader" aria-label="Reading activity" hidden>
      <header>
        <button id="edit" class="btn btn-outline-secondary">Edit</button>
      </header>
      <div id="pages"></div>
      <nav id="example-dots" aria-label="Reading examples"></nav>
      <nav id="row-nav" aria-label="Rows in this example">
        <button id="prev" aria-label="Previous row">↑</button
        ><button id="next" aria-label="Next row">↓</button>
      </nav>
      <footer>
        <div class="example-controls">
          <button
            id="previous-example"
            class="btn btn-outline-secondary"
            aria-label="Previous example"
            title="Previous example"
          >
            ←</button
          ><span id="example-count"></span
          ><button
            id="next-example"
            class="btn btn-outline-primary"
            aria-label="Next example"
            title="Next example"
          >
            →
          </button>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
      </footer>
    </section>
    <div id="measure" aria-hidden="true"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/reading-features.js"></script>
    <script src="assets/js/slider-track-colors.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/share-link.js"></script>
    <script src="assets/js/lesson-common.js"></script>
    <script src="assets/js/tool-navigation.js"></script>
    <script src="assets/js/activity-timers.js"></script>
    <script src="assets/js/interface.js"></script>
  </body>
</html>
